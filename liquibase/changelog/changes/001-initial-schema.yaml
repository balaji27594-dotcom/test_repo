databaseChangeLog:
  - changeSet:
      id: 1
      author: balaji
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: NUMBER
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR2(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: email
                  type: VARCHAR2(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: SYSTIMESTAMP
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: SYSTIMESTAMP

  - changeSet:
      id: 2
      author: balaji
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: id
                  type: NUMBER
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: NUMBER
                  constraints:
                    nullable: false
              - column:
                  name: role_name
                  type: VARCHAR2(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: SYSTIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_roles_user_id

