# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Spin up Oracle Database Docker image
      - name: Start Oracle Database
        run: |
          docker run -d \
            --name oracle-db \
            -p 1521:1521 \
            -e ORACLE_ADMIN_PASSWORD=admin123 \
            -e ORACLE_PASSWORD=oracle123 \
            gvenzl/oracle-xe:latest

      # Wait for Oracle Database to be ready
      - name: Wait for Oracle Database to be ready
        run: |
          for i in {1..60}; do
            if docker exec oracle-db sqlplus -version &> /dev/null; then
              echo "Oracle Database is ready"
              exit 0
            fi
            echo "Waiting for Oracle Database... ($i/60)"
            sleep 2
          done
          echo "Oracle Database failed to start"
          exit 1

      # Connect to Oracle Database
      - name: Connect to Oracle Database
        run: |
          docker exec oracle-db sqlplus -v system/admin123@localhost:1521/XE << EOF
          SELECT * FROM v\$version;
          EXIT;
          EOF

      # Create a Docker network for communication between containers
      - name: Create Docker network
        run: docker network create liquibase-network || true

      # Connect Oracle container to the network
      - name: Connect Oracle to network
        run: docker network connect liquibase-network oracle-db || true

      # Run Liquibase Docker container
      - name: Run Liquibase migrations
        run: |
          docker run --rm \
            --network liquibase-network \
            -v ${{ github.workspace }}/liquibase/changelog:/liquibase/changelog \
            liquibase/liquibase:latest \
            --url=jdbc:oracle:thin:@oracle-db:1521:XE \
            --username=system \
            --password=admin123 \
            --changeLogFile=/liquibase/changelog/db.changelog-master.yaml \
            update

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
